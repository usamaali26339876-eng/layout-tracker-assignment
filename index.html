<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Budget Tracker</title>
    <!-- Google Fonts Link for clean typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Card 1: Page Heading Section -->
        <header class="card header-card">
            <h1>Budget Tracker</h1>
            <p>Track your daily expenses and manage your balance efficiently.</p>
        </header>

        <!-- Card 2: Add Expense Form Section -->
        <section class="card form-card">
            <h2>Add New Expense</h2>
            <form id="expense-form">
                <div class="form-group">
                    <label for="expense-name">Expense Name</label>
                    <input type="text" id="expense-name" placeholder="e.g., Groceries" required>
                </div>
                <div class="form-group">
                    <label for="expense-amount">Amount ($)</label>
                    <input type="number" id="expense-amount" placeholder="e.g., 45.00" min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="expense-category">Category</label>
                    <select id="expense-category" required>
                        <option value="" disabled selected>Select a category</option>
                        <option value="Food">Food & Dining</option>
                        <option value="Rent">Rent & Utilities</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Transport">Transportation</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Add Expense</button>
            </form>
        </section>

        <!-- Card 3: Expense Table Section -->
        <section class="card table-card">
            <h2>Recent Expenses</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Weekly Groceries</td>
                            <td>Food</td>
                            <td class="amount-cell">$68.50</td>
                        </tr>
                        <tr>
                            <td>Electric Bill</td>
                            <td>Rent</td>
                            <td class="amount-cell">$120.00</td>
                        </tr>
                        <tr>
                            <td>Movie Ticket</td>
                            <td>Entertainment</td>
                            <td class="amount-cell">$15.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

</body>
</html>
